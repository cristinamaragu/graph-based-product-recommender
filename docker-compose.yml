services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_PATH: ${MODEL_PATH:-examples/sample_model.json}
    volumes:
      - ./artifacts:/app/artifacts:ro
  neo4j:
    image: neo4j:5.26-community
    profiles: [analysis]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-MUST_CONFIGURE_BEFORE_ANALYSIS}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Reads the password from NEO4J_AUTH inside the container; nothing hard-coded.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
  notebook:
    build:
      context: .
      dockerfile: Dockerfile.analysis
    profiles: [analysis]
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-MUST_CONFIGURE_BEFORE_ANALYSIS}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-MUST_CONFIGURE_BEFORE_ANALYSIS}
    volumes:
      - .:/app
    depends_on:
      neo4j:
        condition: service_healthy
volumes:
  neo4j_data:
